<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    >
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Red+Hat+Text:wght@700&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="./styles.css">

    <title>Frontend Mentor | Launch countdown timer</title>
  </head>
  <body>
    <main class="countdown-app" data-flip-animation="true">
      <h1 class="title">We're launching soon</h1>

      <div class="timer" role="group" aria-label="Time remaining before launch">
        <h2 class="sr-only">Countdown</h2>

        <div class="timer-segment" data-segment="days">
          <div class="flip-card" role="status" aria-live="polite">
            <div class="flip-static" aria-hidden="true">
              <span class="half half-top"
                ><span class="number" data-part="top">14</span></span
              >
              <span class="half half-bottom"
                ><span class="number" data-part="bottom">14</span></span
              >
            </div>
            <span class="sr-only" data-sr-value>14</span>
            <div class="flip-layer flip-top" aria-hidden="true">
              <span class="number" data-flip-old>14</span>
            </div>
            <div class="flip-layer flip-bottom" aria-hidden="true">
              <span class="number" data-flip-new>14</span>
            </div>
          </div>
          <p class="segment-label">Days</p>
        </div>

        <div class="timer-segment" data-segment="hours">
          <div class="flip-card" role="status" aria-live="polite">
            <div class="flip-static" aria-hidden="true">
              <span class="half half-top"
                ><span class="number" data-part="top">00</span></span
              >
              <span class="half half-bottom"
                ><span class="number" data-part="bottom">00</span></span
              >
            </div>
            <span class="sr-only" data-sr-value>00</span>
            <div class="flip-layer flip-top" aria-hidden="true">
              <span class="number" data-flip-old>00</span>
            </div>
            <div class="flip-layer flip-bottom" aria-hidden="true">
              <span class="number" data-flip-new>00</span>
            </div>
          </div>
          <p class="segment-label">Hours</p>
        </div>

        <div class="timer-segment" data-segment="minutes">
          <div class="flip-card" role="status" aria-live="polite">
            <div class="flip-static" aria-hidden="true">
              <span class="half half-top"
                ><span class="number" data-part="top">00</span></span
              >
              <span class="half half-bottom"
                ><span class="number" data-part="bottom">00</span></span
              >
            </div>
            <span class="sr-only" data-sr-value>00</span>
            <div class="flip-layer flip-top" aria-hidden="true">
              <span class="number" data-flip-old>00</span>
            </div>
            <div class="flip-layer flip-bottom" aria-hidden="true">
              <span class="number" data-flip-new>00</span>
            </div>
          </div>
          <p class="segment-label">Minutes</p>
        </div>

        <div class="timer-segment" data-segment="seconds">
          <div class="flip-card" role="status" aria-live="polite">
            <div class="flip-static" aria-hidden="true">
              <span class="half half-top"
                ><span class="number" data-part="top">00</span></span
              >
              <span class="half half-bottom"
                ><span class="number" data-part="bottom">00</span></span
              >
            </div>
            <span class="sr-only" data-sr-value>00</span>
            <div class="flip-layer flip-top" aria-hidden="true">
              <span class="number" data-flip-old>00</span>
            </div>
            <div class="flip-layer flip-bottom" aria-hidden="true">
              <span class="number" data-flip-new>00</span>
            </div>
          </div>
          <p class="segment-label">Seconds</p>
        </div>
      </div>

      <ul class="social-links" aria-label="Social media links">
        <li>
          <a href="#" aria-label="Facebook"
            ><img src="./images/icon-facebook.svg" alt=""
          /></a>
        </li>
        <li>
          <a href="#" aria-label="Pinterest"
            ><img src="./images/icon-pinterest.svg" alt=""
          /></a>
        </li>
        <li>
          <a href="#" aria-label="Instagram"
            ><img src="./images/icon-instagram.svg" alt=""
          /></a>
        </li>
      </ul>
    </main>

    <script src="./app.js" defer></script>
  </body>
</html>
